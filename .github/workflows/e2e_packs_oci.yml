name: e2e_packs_oci

on:
  schedule:
    - cron: "44 3 * * *"
  workflow_dispatch:
  # pull_request: removed per plans/binary-bifurcation.md Phase A heavy-job sweep

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-packs-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The packs this job pulls are public; the login only raises the
      # anonymous rate limit. It used GREENTIC_GITHUB_TOKEN as greentic-bot,
      # which GHCR has refused ("denied: denied") since 2026-09-09 and took
      # the whole job down with it. Same fallback ci.yml/integration.yml use.
      - name: Login to GHCR
        uses: docker/login-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN != '' && env.GHCR_TOKEN || env.GITHUB_TOKEN }}

      - name: Install crane and jq
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y jq; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
            echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
            sleep 15
          done
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.1/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane

      - name: Resolve OCI digests
        env:
          ALLOW_LATEST: "1"
          PACKS_MANIFEST: tests/packs/manifest.txt
          DOCKER_CONFIG: /home/runner/.docker
        run: |
          scripts/oci_resolve_digests.sh

      - name: Generate pack index
        env:
          TENANT_NAME: integration
          MAIN_PACK_NAME: greentic-packs/messaging-dummy
          OVERLAY_PACK_NAMES: greentic-packs/secrets-k8s,greentic-packs/events-dummy
        run: |
          scripts/make_pack_index.sh

      - name: Run E2E tests (OCI packs)
        env:
          PACK_INDEX_URL: file://${{ github.workspace }}/target/index.json
          GREENTIC_PROVIDER_CORE_ONLY: "1"
        run: |
          cargo test -p greentic-integration pack_index_shape_matches_runner_contract -- --nocapture
          cargo test -p greentic-integration e2e_messaging_dummy_send -- --nocapture
          cargo test -p greentic-integration e2e_secrets_k8s_smoke -- --nocapture
          cargo test -p greentic-integration e2e_events_publish -- --nocapture
          cargo test -p greentic-integration events_manifest_guard -- --nocapture
