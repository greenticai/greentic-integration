name: Integration

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  # pull_request: removed per plans/binary-bifurcation.md Phase A heavy-job sweep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  packs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pack fixtures
        run: make packs.test

  harness:
    runs-on: ubuntu-latest
    needs:
      - lint
      - packs
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: 1.94.0
      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Renderer snapshot tests
        run: make render.snapshot
      - name: Runner smoke harness
        run: make runner.smoke

  messaging-provider:
    runs-on: ubuntu-latest
    needs:
      - harness
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: 1.94.0
      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Messaging/provider E2E
        env:
          E2E_REQUIRE_DOCKER: "1"
        run: cargo test -p greentic-integration --test e2e_messaging_provider -- --nocapture

  webchat:
    runs-on: ubuntu-latest
    needs:
      - packs
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(github.event_name == 'schedule' && '["chromium","firefox"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webchat-e2e/package-lock.json
      - name: Install npm dependencies
        run: npm ci
        working-directory: webchat-e2e
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: webchat-e2e/node_modules/.cache/ms-playwright/${{ matrix.project }}
          key: ${{ runner.os }}-playwright-${{ matrix.project }}-${{ hashFiles('webchat-e2e/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install ${{ matrix.project }}
        working-directory: webchat-e2e
      - name: WebChat contract tests
        run: make webchat.contract
      - name: Playwright e2e
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: make webchat.e2e

  pack-audit:
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: 1.94.0
      - name: Install crane
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.1/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
      - name: GHCR login
        uses: docker/login-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN != '' && env.GHCR_TOKEN || env.GITHUB_TOKEN }}
      - name: Pack audit
        env:
          GREENTIC_GITHUB_TOKEN: ${{ secrets.GREENTIC_GITHUB_TOKEN }}
          GREENTIC_GITHUB_USER: ${{ vars.GREENTIC_GITHUB_USER }}
          GREENTIC_GITHUB_ORG: ${{ vars.GREENTIC_GITHUB_ORG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GT_CRANE_LOGIN: "0"
        run: |
          set -euo pipefail
          cargo run -p greentic-integration --bin pack_audit
      - name: Pack audit tests
        env:
          GREENTIC_GITHUB_TOKEN: ${{ secrets.GREENTIC_GITHUB_TOKEN }}
          GREENTIC_GITHUB_USER: ${{ vars.GREENTIC_GITHUB_USER }}
          GREENTIC_GITHUB_ORG: ${{ vars.GREENTIC_GITHUB_ORG }}
        run: |
          cargo test -p greentic-integration pack_audit_ -- --nocapture

  nightly-test-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - lint
    env:
      GREENTIC_CONTROL_CHAIN_PATH: vendor/greentic-control-chain
      GREENTIC_FAST2FLOW_GH_TOKEN: ${{ secrets.GREENTIC_BIZ_GH_TOKEN != '' && secrets.GREENTIC_BIZ_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout greentic-control-chain fixtures
        uses: actions/checkout@v4
        # Public repo (moved from greentic-ai-org), so the job's own token is
        # enough. It used GREENTIC_GITHUB_TOKEN, whose revocation failed this
        # checkout with "Bad credentials" — the `!= ''` fallback never fires
        # for a secret that is set but dead.
        with:
          repository: greenticai/greentic-control-chain
          path: vendor/greentic-control-chain
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          toolchain: 1.94.0
      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Stage ingress-control fixture packs
        env:
          GH_TOKEN: ${{ env.GREENTIC_FAST2FLOW_GH_TOKEN }}
        run: make e2e.fixtures
      - name: Install Node.js for webchat
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webchat-e2e/package-lock.json
      - name: Install Playwright browsers (chromium + firefox)
        run: |
          npm ci --prefix webchat-e2e
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium firefox
      - name: Install cargo-binstall and Greentic CLIs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-binstall >/dev/null 2>&1; then
            curl -sL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          fi
          cargo binstall greentic-dev --no-confirm --force
          cargo binstall greentic-pack --no-confirm --force
      - name: Run full test suite
        env:
          GREENTIC_PROVIDER_CORE_ONLY: "1"
          GREENTIC_INTEGRATION_STRICT: "1"
          GREENTIC_PACK_NO_FALLBACK: "1"
          GREENTIC_STACK_STRICT: "1"
          GREENTIC_DEV_E2E_STRICT: "1"
        run: |
          set -euo pipefail
          make test.all
